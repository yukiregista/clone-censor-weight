name: Publish clone-censor-weight package to PyPI and TestPyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install build tools
      run: >-
        python3 -m
        pip install
        build
        twine
        --user
    - name: Verify release tag matches package version
      if: github.event_name == 'release'
      run: |
        python3 - <<'PY'
        import os
        import tomllib
        from pathlib import Path

        project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
        expected_tag = f"v{project['version']}"
        actual_tag = os.environ["GITHUB_REF_NAME"]
        if actual_tag != expected_tag:
            raise SystemExit(
                f"Release tag {actual_tag!r} does not match package version; "
                f"expected {expected_tag!r}"
            )
        PY
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check distribution metadata
      run: python3 -m twine check dist/*
    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish clone-censor-weight distribution to PyPI
    if: >-
      github.repository == 'yukiregista/clone-censor-weight' &&
      github.event_name == 'release' &&
      github.event.release.prerelease == false
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clone-censor-weight
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish clone-censor-weight distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish clone-censor-weight distribution to TestPyPI
    if: >-
      github.repository == 'yukiregista/clone-censor-weight' &&
      github.event_name == 'workflow_dispatch'
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/clone-censor-weight

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish clone-censor-weight distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
